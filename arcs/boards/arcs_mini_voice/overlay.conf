# USB-powered ARCS Mini voice box; no robot-dog peripherals.
CONFIG_BOARD_ARCS_MINI_VOICE=y
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_UART1=n
CONFIG_LISA_UART2=n
CONFIG_LISA_PWM=y
CONFIG_LISA_I2C=n
CONFIG_LISA_SDMMC_DEVICE=n
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_LISA_CAMERA_DEVICE=n
CONFIG_LISA_DVP_DEVICE=n
CONFIG_LISA_TOUCH_DEVICE=n
CONFIG_LISA_DISPLAY_DEVICE=y
CONFIG_LISA_DISPLAY_PANEL_ST7789P3=y
CONFIG_LISA_DISPLAY_COMPOSITE=n
CONFIG_LISA_DUAL_DISPLAY=n
CONFIG_LISA_DISPLAY_TE_SYNC=n
CONFIG_LISA_DISPLAY_CPDMA_ROTATE=n
CONFIG_LISA_DISPLAY_BUS_SPI_4WIRE=y
CONFIG_LISA_DISPLAY_SPI_4WIRE_DMA_CH=0
CONFIG_LISA_DISPLAY_COLOR_INVERT=y
CONFIG_LISA_SPI0=y
CONFIG_PANEL_ST7789P3_WIDTH=240
CONFIG_PANEL_ST7789P3_HEIGHT=240
CONFIG_PANEL_ST7789P3_X_OFFSET=0
CONFIG_PANEL_ST7789P3_Y_OFFSET=0
# This UI never requests SDK software rotation; avoid its default 15 KiB scratch area.
CONFIG_ROTATE_BUF_MAX_HEIGHT=16
CONFIG_GADGET_NODE_PREFIX="arcs-mini"
CONFIG_GADGET_DISPLAY_NAME="ARCS Mini"
CONFIG_GADGET_MODEL_ID="arcs-mini-voice"

# Local AP keyword engine; reuse the preserved ROMFS resources read-only.
CONFIG_ACOMP=y
CONFIG_ACOMP_WAKEUP=y
CONFIG_ACOMP_WAKEUP_ALGORITHM_TYPE_SINGLE_MIC=y
CONFIG_ACOMP_WAKEUP_ALGORITHM_TYPE_DUAL_MIC=n
