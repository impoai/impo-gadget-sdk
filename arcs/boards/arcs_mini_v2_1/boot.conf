# ARCS-MINI V2.1 standalone boot configuration.
#
# Keep the production arcs_mini recovery/OTA feature set, but never initialize
# the display path: this PCB revision has no LCD.  The boot image is linked at
# Flash offset 0 and hands control to the AP image at offset 0x040000.

CONFIG_ARCS_AP_CORE=y
CONFIG_BOOT_APP_CORE_AP=y
CONFIG_APPLICATION_ADDRESS=0x30040000

# Flash OTA and USB recovery are retained so Type-C/ADB upgrades work after the
# board has received its initial UART provisioning.
CONFIG_BOOT_OTA_PACKAGE=y
CONFIG_BOOT_OTA_SOURCE_TF=n
CONFIG_BOOT_OTA_API=y
CONFIG_BOOT_CONTROL_STORE_BASE_ADDR=0x3003E000
CONFIG_BOOT_ADB=y
CONFIG_BOOT_ADB_SYNC=y
CONFIG_BOOT_ADB_SOFT_RECOVERY_TIMEOUT_MS=30000
CONFIG_BOOT_ADB_BACKEND_CHERRYUSB=y
CONFIG_BOOT_ADB_SDMMC_RAW=n
CONFIG_BOOT_ADB_SDMMC_FS=n
CONFIG_BOOT_EARLY_LOG=y
CONFIG_BOOT_LOG_LVL_INF=y

# Power-key/latch wiring is unchanged from arcs_mini.  The guard owns the
# POWER_KEY + USB startup decision, so the separate instantaneous key check
# must stay disabled.
CONFIG_BOOT_POWER_GUARD=y
CONFIG_BOOT_POWER_GUARD_LED=y
CONFIG_BOOT_CHECK_POWER_KEY=n
CONFIG_BOOT_FEATURES=y

# V2.1 is headless.  Keep these explicit so the base recovery config can never
# pull the ST7789/display stack back into this boot image.
CONFIG_BOOT_DISPLAY=n
CONFIG_LISA_DISPLAY_DEVICE=n
CONFIG_LISA_MODEM=n
