# impo-gadget-arcs: CP application configuration.
# Memory map, IPC and boot settings must match the AP image (res/arcs_mini_v2_1/ap.bin)
# and the bootloader already on the device; they are taken unchanged from mtt1.0-impo 2.7.3.

# ---- Core / memory (must match ap.bin) ----
CONFIG_BOOT_HART=n
CONFIG_ARCS_CP_CORE=y
CONFIG_MODULE_FREERTOS=y
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y
CONFIG_FREERTOS_FAST_FUNC_SECTION=".text"
CONFIG_MODULE_HEAP=y
CONFIG_LINK_OPTION_NOSYS_SPECS=y
CONFIG_MEM_CONFIG=n
CONFIG_MEM_CONFIG_USE_CUSTOM_FILE=y
CONFIG_MEM_FLASH_BASE=0x30600000
CONFIG_MEM_PSRAM_BASE=0x28800000
CONFIG_MEM_PSRAM_SIZE=0x00800000
CONFIG_MEM_WFRAM_SIZE=0x00017000
CONFIG_MEM_SRAM_BASE=0x20017000
CONFIG_MEM_SRAM_SIZE=0x00029000
CONFIG_MEM_LUNA_SHARED_BASE=0x20042000
CONFIG_MEM_LUNA_SHARED_SIZE=0x00007000
CONFIG_MEM_IPC_BASE=0x20040000
CONFIG_MEM_IPC_SIZE=0x00002000
CONFIG_MEM_APRAM_BASE=0x20058800
CONFIG_MEM_APRAM_SIZE=0x00057800
CONFIG_HEAP_SIZE=0x3000
CONFIG_PSRAM_HEAP_SIZE=0x500000
CONFIG_BACK_TRACE=y
CONFIG_CORE_SPINLOCK=n
CONFIG_ARCS_HAL_DCACHE_COHERENT=n
CONFIG_ARCS_GPDMA_FULL_INIT=y

# ---- Inter-core IPC and flash access while the AP runs from flash ----
CONFIG_ARCS_HAL_IPC=y
CONFIG_ARCS_HAL_FLASH_IF=y
CONFIG_ARCS_HAL_IPC_FLASH_AGENT=y
CONFIG_ARCS_HAL_IPC_HALT_PEER_CORE=y
CONFIG_LISA_FLASH_MSG=y
CONFIG_LISA_FLASH_ARCS_HALT_REMOTE_CORE=y
CONFIG_ARCS_HAL_LSF=y
CONFIG_IPC_LSF=y
CONFIG_LSF_CLIENT=y
CONFIG_ARCS_HAL_NVS=y
CONFIG_ARCS_HAL_WLIF=y
CONFIG_ARCS_HAL_EVENT=y
CONFIG_ARCS_HAL_UTILS=y
CONFIG_ARCS_HAL_IC_MUTEX=n
CONFIG_ARCS_HAL_WCND_GPADC_IC_MUTEX=n
CONFIG_ARCS_HAL_WCND_RF_SELFCALI_FROM_NV=n

# ---- Boot loader interfaces (recovery for adb flashing, power latch) ----
CONFIG_BOOT=n
CONFIG_BOOT_WITH_WATCHDOG=y
# The boot leaves the AP watchdog to the app; keep it off until the app feeds it.
CONFIG_WATCHDOG_ENABLE=n
CONFIG_BOOT_RECOVERY_API=y
CONFIG_BOOT_POWER_API=y
CONFIG_BOOT_FEATURES_API=y
CONFIG_BOOT_CONTROL_STORE_FLASH=y
CONFIG_BOOT_CONTROL_STORE_BASE_ADDR=0x3003E000
CONFIG_BOOT_CONTROL_STORE_SIZE=4096

# ---- OS helpers, logging, shell ----
CONFIG_LISA_OS=y
CONFIG_LISA_PORTING=y
CONFIG_LISA_DEVICE=y
CONFIG_LISA_UART_DEVICE=y
CONFIG_LISA_UART0=y
CONFIG_LOG=y
CONFIG_SDK_MODULE_EASYLOGGER=y
CONFIG_EASYLOGGER_LINE_BUF_SIZE=2048
CONFIG_LISA_SHELL=y
CONFIG_SDK_MODULE_LETTER_SHELL=y
CONFIG_SDK_MODULE_LETTER_SHELL_CONFIG_FILE="shell_cfg_user.h"
CONFIG_SYSLOG_UART_BACKEND=y
CONFIG_CJSON=y
CONFIG_COMPILE_OPTION_WARNING_AS_ERROR=y

# ---- Storage ----
CONFIG_LISA_KV=y
CONFIG_LISA_KV_TYPE_EF=y
CONFIG_SDK_MODULE_EASYFLASH=y
CONFIG_LS_EF_ENV_AREA_SIZE=32768

# ---- USB: ADB shell (keeps adb flashing working) ----
CONFIG_TINY_USB=y
CONFIG_TINY_USB_USE_CUSTOM_CONFIG_FILE=y
CONFIG_TINY_USB_CONFIG_FILE="tusb_config.h"
CONFIG_TUSB_APP_CLASS=y
CONFIG_ADB_SHELL=y
CONFIG_ADB_SHELL_BUFFER_SIZE=1024
CONFIG_ADB_SYNC=n

# ---- Network: Wi-Fi station, lwIP, sockets ----
CONFIG_LISA_WIFI=y
CONFIG_WIFI=y
CONFIG_WIFI_LWIP_SAME_CORE=y
CONFIG_WIFI_TX_BUF_COPY=y
CONFIG_WIFI_MANAGER=y
CONFIG_WIFI_MGR_NVS_PARTITION_OFFSET=0xff0000
CONFIG_MAC_MANAGER=y
CONFIG_MAC_MANAGER_MAC_BY_CHIP_ID=y
CONFIG_LWIP=y
CONFIG_LWIP_TX_BUF_COPY=y
CONFIG_LWIP_OPTION_LWIP_DNS=y
CONFIG_LWIP_OPTION_SO_REUSE=y
CONFIG_LWIP_NETAL_TX_SMALL_BUF_CNT=40
CONFIG_LWIP_NETAL_TX_BUF_CNT=15
CONFIG_LISA_NETWORK=y
CONFIG_LISA_NET=y
CONFIG_SAL_USING_POSIX=y

# ---- Flash driver (KV, Wi-Fi NVS) ----
CONFIG_LISA_FLASH=y
CONFIG_LISA_FLASH_INIT_PRIORITY=15
CONFIG_LISA_FLASH_ARCS=y
CONFIG_LISA_FLASH_ARCS_HALT_REMOTE_CORE=y
CONFIG_LISA_FLASH_ARCS_CONTROLLER_BASE_ADDR=0x47600000
CONFIG_LISA_FLASH_ARCS_ERASE_SECTOR_SIZE=4096
CONFIG_LISA_FLASH_ARCS_WRITE_BLOCK_SIZE=4
CONFIG_LISA_FLASH_ARCS_DATA_WIDTH=4
CONFIG_LISA_FLASH_ARCS_SCLK_DIV=255
CONFIG_LISA_FLASH_ARCS_ADDR_BYTES=3
CONFIG_LISA_FLASH_ARCS_WRITE_PROTECT_ENABLE=y
CONFIG_LISA_FLASH_ARCS_DISABLE_INTERRUPTS=y
CONFIG_LISA_FLASH_ARCS_FLASH_PHYS_ADDR=0x30000000
CONFIG_LISA_FLASH_ARCS_FLASH_PHYS_RESERVE_SIZE=0x10000000
CONFIG_DISK_MEM=n
CONFIG_DISK_MEM_SERVER=n

# ---- Time and TLS (gadgets.impo.ai; config in platform/arcs/gadget_mbedtls_config.h) ----
CONFIG_LISA_SNTP=y
CONFIG_MODULE_CORESNTP=y
CONFIG_SDK_MODULE_MBEDTLS=y
CONFIG_CUSTOM_MBEDTLS_CFG_FILE=y
CONFIG_MBEDTLS_CFG_FILE="gadget_mbedtls_config.h"
CONFIG_MBEDTLS_HARDWARE_ENTROPY=y
CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y

# Long enough for "pair set <access> <refresh>" (letter-shell splits the buffer by history depth).
CONFIG_LISA_SHELL_BUFFER_SIZE=3072

# ---- BLE peripheral for Impo app pairing (local stack on the CP core, coexists with Wi-Fi) ----
CONFIG_BLE=y
CONFIG_LISA_BLUETOOTH=y
CONFIG_LISA_BLUETOOTH_BLE=y
CONFIG_LISA_BLUETOOTH_DEVICE_NAME="ImpoGadget"

# A crash reboots (the crash record is printed on the next boot) instead of hanging.
CONFIG_EXCEPTION_REBOOT_IMMEDIATELY=y
CONFIG_LISA_WDT=y

# Speaker: on-chip DAC (audio0), amplifier on PA01 driven by the board.
CONFIG_LISA_AUDIO_DEVICE=y
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
# The driver hands mic audio over on this task; it must never wait behind ours (max is 5).
CONFIG_LISA_AUDIO_DISPATCH_TASK_PRIORITY=5

# speaker.play_url decodes MP3 with the SDK Helix decoder.
CONFIG_SDK_MODULE_MP3_DECODER=y
